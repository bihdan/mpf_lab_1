spring.application.name=MPF-Library-Spring-Boot
server.port=${PORT:8080}

app.custom.message=Welcome to our library! (Production)

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.freemarker.template-loader-path=classpath:/mail-templates/

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

mail.resend.api-key=${RESEND_API_KEY}
mail.resend.from=${MAIL_FROM:Book App <onboarding@resend.dev>}
app.mail.admin=${APP_MAIL_ADMIN:vynychenkoos@gmail.com}
app.base-url=${APP_BASE_URL:https://mpf-labs-efbe.onrender.com}