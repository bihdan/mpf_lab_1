spring.application.name=MPF-Library-Spring-Boot
server.port=8080
app.custom.message=Welcome to our library!

# --- ??????????? ?? ???????????? ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- ???????????? ????????? WEB (UTF-8) ---
spring.web.encoding.enabled=true
spring.web.encoding.force=true
spring.web.encoding.charset=UTF-8

# --- ???????????? THYMELEAF ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html

# --- ???? ????? ---
spring.datasource.url=jdbc:h2:file:./data/guest;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true