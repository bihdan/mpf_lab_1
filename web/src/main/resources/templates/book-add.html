<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .form-container {
        background: #fff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 500px;
    }
    h1 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 30px;
        font-size: 1.8em;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #34495e;
    }
    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 15px;
        font-family: inherit;
        box-sizing: border-box;
    }
    input:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }
    button {
        background: #3498db;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        width: 100%;
        transition: background 0.2s;
        margin-top: 10px;
    }
    button:hover {
        background: #2980b9;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
        color: #7f8c8d;
        font-size: 0.9em;
    }
    .back-link:hover {
        color: #3498db;
    }
</style>
<body>

<div class="form-container">
    <h1 th:text="#{title.addBook}">Add book</h1>

    <form th:action="@{/books}" th:object="${bookForm}" method="post">
        <div class="form-group">
            <label>
                <span th:text="#{label.title}">Title</span>
                <input th:field="*{title}" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span th:text="#{label.author}">Author</span>
                <input th:field="*{author}" required>
            </label>
        </div>

        <div class="form-group">
            <label>
                <span th:text="#{label.year}">Year</span>
                <input type="number" th:field="*{pubYear}" required min="1000" max="2026">
            </label>
        </div>

        <button type="submit" th:text="#{label.addBook}">Add</button>
    </form>

    <a th:href="@{/books}" class="back-link" th:text="#{label.backToList}">← Back to list</a>
</div>

</body>
</html>
