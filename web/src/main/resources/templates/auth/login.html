<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вхід — Книжкова полиця</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 25px; font-weight: 600; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1em; transition: border-color 0.3s; }
        input:focus { border-color: #3498db; outline: none; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1em; margin-top: 15px; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; line-height: 1.4; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .link-text { margin-top: 25px; color: #64748b; font-size: 0.95em; }
        .link-text a { color: #3498db; text-decoration: none; font-weight: bold; }
        .link-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Вхід</h2>

    <div th:if="${param.error}" class="alert alert-error">Неправильний email або пароль</div>
    <div th:if="${param.logout}" class="alert alert-info">Ви успішно вийшли із системи</div>
    <div th:if="${param.registered}" class="alert alert-success">Реєстрація успішна! Тепер ви можете увійти</div>

    <form th:action="@{/login}" method="post">
        <input type="email" name="email" placeholder="Електронна пошта" required autofocus>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Увійти</button>
    </form>

    <div class="link-text">
        Немає акаунту? <a th:href="@{/register}">Зареєструватися</a>
    </div>
</div>
</body>
</html>
