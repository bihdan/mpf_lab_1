<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація — Книжкова полиця</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 25px; font-weight: 600; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1em; transition: border-color 0.3s; }
        input:focus { border-color: #3498db; outline: none; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1em; margin-top: 15px; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .error-msg { color: #dc2626; font-size: 0.85em; text-align: left; margin-top: -5px; margin-bottom: 5px; padding-left: 5px; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; }
        .link-text { margin-top: 25px; color: #64748b; font-size: 0.95em; }
        .link-text a { color: #3498db; text-decoration: none; font-weight: bold; }
        .link-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Створити акаунт</h2>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <div>
            <input type="email" th:field="*{email}" placeholder="Email" required>
            <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div>
            <input type="text" th:field="*{nickname}" placeholder="Нікнейм" required>
        </div>

        <div>
            <input type="password" th:field="*{password}" placeholder="Пароль (мін. 6 символів)" required>
            <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit">Зареєструватися</button>
    </form>

    <div class="link-text">
        Вже є акаунт? <a th:href="@{/login}">Увійти</a>
    </div>
</div>
</body>
</html>
