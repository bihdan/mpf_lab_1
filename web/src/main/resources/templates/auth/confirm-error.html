<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Помилка активації</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff5f5; margin: 0; }
        .error-box { text-align: center; padding: 40px; border: 2px solid #feb2b2; background: white; border-radius: 12px; }
        h1 { color: #c53030; }
        a { color: #3182ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="error-box">
    <h1>Помилка верифікації</h1>
    <p th:text="${error}">Токен недійсний або термін його дії закінчився.</p>
    <p><a th:href="@{/register}">Спробуйте зареєструватися знову</a></p>
</div>
</body>
</html>
