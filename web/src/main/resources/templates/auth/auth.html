<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вхід</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Вхід у систему</h2>

    <div th:if="${param.error}" style="color: red; margin-bottom: 10px;">Неправильний email або пароль</div>
    <div th:if="${param.logout}" style="color: green; margin-bottom: 10px;">Ви вийшли з системи</div>
    <div th:if="${param.registered}" style="color: blue; margin-bottom: 10px;">Реєстрація успішна! Увійдіть.</div>

    <form th:action="@{/login}" method="post">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Увійти</button>
    </form>
    <p style="margin-top: 15px; font-size: 0.9em;">
        Немає акаунту? <a th:href="@{/register}">Зареєструватися</a>
    </p>
</div>
</body>
</html>
