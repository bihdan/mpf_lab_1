<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header}">
    <title th:text="|${book.title} - #{title.comments}|">Коментарі</title>
</head>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1, h3 { color: #2c3e50; }
    hr { border: 0; height: 1px; background: #eee; margin: 25px 0; }

    /* Стиль для повідомлення про помилку */
    .error-alert {
        background-color: #fdeaea;
        color: #e74c3c;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #e74c3c;
        margin-bottom: 25px;
        font-weight: bold;
    }

    ul.comment-list { list-style-type: none; padding: 0; }
    li.comment-item { background: #fdfdfd; border: 1px solid #eee; padding: 20px; margin-bottom: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
    .comment-author { font-weight: bold; color: #2980b9; text-decoration: none; }
    .comment-author:hover { text-decoration: underline; }
    .comment-meta { font-size: 0.85em; color: #999; display: block; margin-top: 5px; }

    .form-group { margin-bottom: 20px; }
    .styled-input {
        width: 100%; padding: 12px 15px; border: 2px solid #e0e6ed; border-radius: 8px;
        background-color: #f8fafc; transition: all 0.3s ease; font-family: inherit; box-sizing: border-box;
    }
    .styled-input:focus {
        border-color: #3498db; outline: none; background-color: #fff; box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
    }
    textarea.styled-input { min-height: 120px; resize: vertical; }

    button { background-color: #3498db; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background-color: #2980b9; }
    button.delete-btn { background-color: #e74c3c; padding: 8px 14px; font-size: 0.85em; }

    .back-btn {
        display: inline-block; margin-top: 30px; text-decoration: none; color: #3498db;
        font-weight: bold; padding: 10px 20px; border: 2px solid #3498db; border-radius: 8px; transition: 0.3s;
    }
    .back-btn:hover { background-color: #3498db; color: white; }
</style>
<body>
<div class="container">
    <div class="book-info" style="text-align: center;">
        <h1 th:text="${book.title}">Назва</h1>
        <p style="color: #7f8c8d; font-style: italic;" th:text="|${book.author}, ${book.pubYear}|">Автор, Рік</p>
    </div>
    <hr>

    <div th:if="${errorMessage}" class="error-alert" th:text="${errorMessage}">
        Помилка бізнес-логіки
    </div>

    <h3 th:text="#{title.comments}">Коментарі</h3>

    <ul class="comment-list">
        <li th:each="c : ${comments}" class="comment-item">
            <div class="comment-content">
                <a class="comment-author" th:href="@{/users/{id}/comments(id=${c.user.id})}"
                   th:text="${c.user.nickname}">Автор</a>: <span th:text="${c.text}">Текст</span>
                <span class="comment-meta" th:text="|(${#temporals.format(c.createdAt, 'dd.MM.yyyy HH:mm')})|"></span>
            </div>

            <form th:if="${c.createdAt != null}"
                  th:action="@{/comments/delete}" method="post" style="margin: 0;">
                <input type="hidden" name="bookId" th:value="${book.id}">
                <input type="hidden" name="commentId" th:value="${c.id}">
                <input type="hidden" name="createdAt" th:value="${c.createdAt}">

                <button sec:authorize="hasRole('ADMIN')" type="submit" class="delete-btn" th:text="#{label.delete}">Видалити</button>
            </form>
        </li>
    </ul>

    <hr>
    <div sec:authorize="isAuthenticated()">
        <h3 th:text="#{title.addComment}">Додати коментар</h3>
        <form th:action="@{/comments}" method="post">
            <input type="hidden" name="bookId" th:value="${book.id}">

            <div class="form-group">
                <label>Ви коментуєте як: <strong th:text="${currentUserNickname}">Нікнейм</strong></label>
                <input type="hidden" name="author" th:value="${#authentication.name}">
            </div>

            <div class="form-group">
                <label th:text="#{label.commentText}">Коментар:</label>
                <textarea name="text" class="styled-input" required th:placeholder="#{placeholder.comment}"></textarea>
            </div>
            <button type="submit" th:text="#{label.addComment}">Надіслати коментар</button>
        </form>
    </div>

    <div sec:authorize="isAnonymous()">
        <p>Щоб залишити коментар, будь ласка, <a th:href="@{/login}">увійдіть</a>.</p>
    </div>

    <a th:href="@{/books}" class="back-btn" th:text="#{label.backToList}">← Назад до списку</a>
</div>
</body>
</html>
